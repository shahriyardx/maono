[package]
name = "maono-mic"
version = "0.1.0"
edition = "2024"
description = "Control a Maono PD100W wireless microphone - CLI, TUI and GUI"
license = "MIT"
repository = "https://github.com/shahriyardx/maono-mic"
keywords = ["maono", "microphone", "hidraw", "tui"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
crossterm = "0.29.0"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
ratatui = "0.30.2"
