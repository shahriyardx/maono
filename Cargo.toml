[package]
name = "maono"
version = "0.4.0"
edition = "2024"
description = "Control a Maono PD100W wireless microphone from a terminal UI or the command line"
license = "MIT"
repository = "https://github.com/shahriyardx/maono"
keywords = ["maono", "microphone", "hidraw", "tui"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"

[[bin]]
name = "maono"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
